buildscript {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'http://files.minecraftforge.net/maven' }
        jcenter()
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3.4'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.3.0"
group = "com.xiaomian124.abf"
archivesBaseName = "a-better-foods-forge"

compileJava.options.encoding = 'UTF-8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = "stable_39"
}

def mcVersion = project.minecraft.version.split('-')[0]

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'http://files.minecraftforge.net/maven' }
}

dependencies {
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", mcVersion
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': mcVersion
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

task replaceJavaVersion {
    doLast {
        def versionFile = file("src/main/java/com/xiaomian124/abf/ABetterFoods.java")
        if (versionFile.exists()) {
            def content = versionFile.text
            def newContent = content.replaceAll(
                    /public static final String VERSION = ".*";/,
                    "public static final String VERSION = \"${project.version}\";"
            )
            if (content != newContent) {
                versionFile.text = newContent
                println "Updated VERSION in ABetterFoods.java to ${project.version}"
            }
        }
    }
}
compileJava.dependsOn replaceJavaVersion

jar {
    manifest {
        attributes 'FMLCorePluginContainsFMLMod': 'true'
    }
}